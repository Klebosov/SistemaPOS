<div class="d-flex justify-content-center align-items-center" style="height: 100vh; background:#f5f5f5;">

  <div class="card p-3 shadow" style="width: 320px;">
    
    <h5 class="text-center mb-3">Login</h5>

    <!-- LOGIN NORMAL -->
    <form (ngSubmit)="login()">
      <input type="text" class="form-control mb-2" placeholder="Nombre de usuario"
        [(ngModel)]="uss" name="uss" required>

      <input type="password" class="form-control mb-3" placeholder="Contraseña"
        [(ngModel)]="password" name="password" required>

      <button class="btn btn-primary w-100 mb-2" type="submit">
        Entrar
      </button>
    </form>

    <hr>

    <!-- VIDEO -->
    <video #video width="100%" autoplay muted class="mb-2"></video>

    <button class="btn btn-secondary w-100 mb-2" (click)="startCamera()">
      Activar cámara
    </button>

    <button class="btn btn-warning w-100 mb-2" (click)="registerFace()">
      Registrar rostro
    </button>

    <button class="btn btn-success w-100" (click)="loginFace()">
      Login facial
    </button>

  </div>

</div>
